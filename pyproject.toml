[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-serve"
version = "0.1.0"
description = "Privacy-preserving cafeteria demand forecasting prototype"
requires-python = ">=3.11"
dependencies = ["torch>=2.13"]

[project.scripts]
adaptive-serve-train = "adaptive_serve.train:main"

[tool.setuptools.packages.find]
include = ["adaptive_serve*"]
